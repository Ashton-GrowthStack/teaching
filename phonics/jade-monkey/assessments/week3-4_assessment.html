<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weeks 3-4 Sight Words Assessment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: white; padding: 30px; }

        .page { page-break-after: always; margin-bottom: 40px; }
        .page:last-child { page-break-after: avoid; }

        .title { text-align: center; margin-bottom: 40px; }
        .title h1 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .title p { font-size: 14px; color: #666; }

        .words-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }

        .word-card { text-align: center; }
        .word-text { font-size: 36px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .assess-box { border: 2px solid #999; width: 100px; height: 100px; margin: 0 auto; background: white; }

        @media print {
            body { padding: 0; margin: 0; }
            .page { margin-bottom: 0; }
        }
    </style>
</head>
<body>
    <!-- WEEK 3-4 -->
    <div class="page">
        <div class="title">
            <h1>Weeks 3-4: Books 4-5</h1>
            <p>Book 4 (Jack and Jill), Book 5 (Man and Ham)</p>
        </div>

        <div class="words-grid">
            <div class="word-card">
                <div class="word-text">goes</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">has</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">likes</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">have</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">for</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">down</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">his</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">some</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">no</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">it</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">my</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">I</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">OK</div>
                <div class="assess-box"></div>
            </div>
        </div>
    </div>
</body>
</html>
