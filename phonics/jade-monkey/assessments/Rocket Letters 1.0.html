/* ── BIG CENTRE ROCKET ── */
.rocket-wrap {
  position: absolute;
  top: 44%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 148mm;
  z-index: 2;
  pointer-events: none;
}
.rocket-wrap img {
  width: 100%;
  display: block;
  filter: drop-shadow(0 8px 28px rgba(0,20,80,0.55)) brightness(1.08);
}

/* ── CENTRE PANEL ── */
.centre-panel {
  position: absolute;
  bottom: 42mm;
  left: 50%;
  transform: translateX(-50%);
  z-index: 4;
  width: 100mm;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2.5mm;
}

.title-block {
  text-align: center;
  background: rgba(5,10,35,0.82);
  border: 3px solid #4af;
  border-radius: 14px;
  padding: 5px 16px 7px;
  box-shadow: 0 4px 18px rgba(0,120,255,0.28), 0 0 30px rgba(0,180,255,0.1);
  width: 100%;
}
.title-main {
  font-family: 'Orbitron', monospace;
  font-size: 13pt;
  font-weight: 900;
  color: #fff;
  letter-spacing: 1px;
  line-height: 1.15;
  text-shadow: 0 0 16px rgba(80,180,255,0.8);
}
.title-sub {
  font-family: 'Orbitron', monospace;
  font-size: 6pt;
  color: #7df;
  letter-spacing: 3px;
  margin-top: 2px;
}

.info-block {
  background: rgba(5,10,35,0.82);
  border: 3px solid #4af;
  border-radius: 14px;
  padding: 7px 14px 9px;
  box-shadow: 0 4px 18px rgba(0,120,255,0.22);
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.info-row {
  display: flex;
  align-items: center;
  gap: 7px;
  border-bottom: 2.5px solid #4af;
  padding-bottom: 3px;
}
.info-label {
  font-family: 'Orbitron', monospace;
  font-size: 8.5pt;
  font-weight: 900;
  color: #7df;
  white-space: nowrap;
}
.info-input {
  flex: 1;
  border: none;
  outline: none;
  font-family: 'Fredoka One', cursive;
  font-size: 16pt;
  color: #fff;
  background: transparent;
  min-width: 0;
}

/* ── COMPLETION BOX ── */
.completion-box {
  background: rgba(5,10,35,0.82);
  border: 3px solid #4af;
  border-radius: 14px;
  padding: 5px 14px 8px;
  box-shadow: 0 4px 18px rgba(0,120,255,0.22);
  width: 100%;
}
.comp-label {
  font-family: 'Orbitron', monospace;
  font-size: 6.5pt;
  font-weight: 900;
  color: #7df;
  letter-spacing: 1px;
  text-align: center;
  margin-bottom: 5px;
}
.comp-stars {
  display: flex;
  justify-content: space-between;
  gap: 4px;
  height: 13mm;
}
.star-box {
  flex: 1;
  border: 2px solid #4af;
  border-radius: 8px;
  background: rgba(0,80,180,0.15);
}

/* ══════════════════════════
   BLEND CARDS — word only, big
══════════════════════════ */
.blend-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: rgba(5,10,35,0.82);
  border: 3px solid #4af;
  border-radius: 14px;
  padding: 10px 12px 10px;
  box-shadow: 0 4px 14px rgba(0,120,255,0.25), 0 0 20px rgba(0,150,255,0.1);
  min-width: 42mm;
}
.word-label {
  font-family: 'Orbitron', monospace;
  font-size: 28pt;
  font-weight: 900;
  color: #fff;
  letter-spacing: 3px;
  line-height: 1;
  text-shadow:
    0 0 18px rgba(80,180,255,0.9),
    0 0 35px rgba(80,180,255,0.4);
}
.holes {
  display: flex;
  gap: 7px;
  margin-top: 2px;
}
.hole {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2.5px solid #4af;
  background: rgba(0,80,180,0.2);
  box-shadow: 0 0 6px rgba(0,150,255,0.3);
}

/* ══════════════════════════
   EDGE STRIPS — same as v5
══════════════════════════ */
.edge-top {
  position: absolute;
  top: 4mm;
  left: 0; right: 0;
  display: flex;
  justify-content: space-evenly;
  align-items: flex-start;
  padding: 0 4mm;
  z-index: 3;
}
.edge-bottom {
  position: absolute;
  bottom: 5mm;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: row;
  justify-content: center;
  align-items: flex-start;
  gap: 3mm;
  z-index: 3;
}
.edge-right {
  position: absolute;
  right: 3mm;
  top: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  padding: 38mm 0 42mm;
  z-index: 3;
}
.edge-left {
  position: absolute;
  left: 3mm;
  top: 0; bottom: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  padding: 38mm 0 42mm;
  z-index: 3;
}

/* Corners */
.corner {
  position: absolute;
  font-size: 22px;
  z-index: 5;
  filter: drop-shadow(0 0 6px rgba(80,180,255,0.7));
}
.corner-tl { top: 4mm; left: 4mm; }
.corner-tr { top: 4mm; right: 4mm; }
.corner-bl { bottom: 5mm; left: 4mm; }
.corner-br { bottom: 5mm; right: 4mm; }

@media print {
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
