<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weeks 7-8 Sight Words Assessment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: white; padding: 30px; }

        .title { text-align: center; margin-bottom: 40px; }
        .title h1 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .title p { font-size: 14px; color: #666; }

        .words-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }

        .word-card { text-align: center; }
        .word-text { font-size: 36px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .assess-box { border: 2px solid #999; width: 100px; height: 100px; margin: 0 auto; background: white; }

        @media print {
            body { padding: 0; margin: 0; }
        }
    </style>
</head>
<body>
    <div class="title">
        <h1>Weeks 7-8: Books 8-10</h1>
        <p>Book 8 (Tom and Vick), Book 9 (Will and Nox), Book 10 (Zed, Zack, Zim)</p>
    </div>

    <div class="words-grid">
        <div class="word-card">
            <div class="word-text">too</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">sorry</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">make</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">pay</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">be</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">with</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">may</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">cannot</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">yucky</div>
            <div class="assess-box"></div>
        </div>
        <div class="word-card">
            <div class="word-text">say</div>
            <div class="assess-box"></div>
        </div>
    </div>
</body>
</html>
