<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jade Monkey Sight Words Assessment</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: white; padding: 20px; }

        .page { page-break-after: always; margin-bottom: 40px; }
        .page:last-child { page-break-after: avoid; }

        .title { text-align: center; margin-bottom: 30px; }
        .title h1 { font-size: 28px; color: #333; margin-bottom: 5px; }
        .title p { font-size: 14px; color: #666; }

        .words-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }

        .word-card { text-align: center; }
        .word-text { font-size: 32px; font-weight: bold; color: #333; margin-bottom: 20px; }
        .assess-box { border: 2px solid #999; width: 100px; height: 100px; margin: 0 auto; background: white; }

        @media print {
            body { padding: 0; margin: 0; }
            .page { margin-bottom: 0; }
        }
    </style>
</head>
<body>
    <!-- BOOK 1 -->
    <div class="page">
        <div class="title">
            <h1>Book 1: Bob and Buck</h1>
            <p>Sight Words Assessment - Week 1</p>
        </div>

        <div class="words-grid">
            <div class="word-card">
                <div class="word-text">and</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">gets</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">in</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">a</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">the</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">bye</div>
                <div class="assess-box"></div>
            </div>
        </div>
    </div>

    <!-- BOOK 2 -->
    <div class="page">
        <div class="title">
            <h1>Book 2: Biff and Duff</h1>
            <p>Sight Words Assessment - Week 2</p>
        </div>

        <div class="words-grid">
            <div class="word-card">
                <div class="word-text">go</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">says</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">to</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">got</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">on</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">up</div>
                <div class="assess-box"></div>
            </div>
            <div class="word-card">
                <div class="word-text">is</div>
                <div class="assess-box"></div>
            </div>
        </div>
    </div>

    <!-- BOOK 3 -->
    <div class="page">
        <div class="title">
            <h1>Book 3: Hog and Dog</h1>
            <p>Sight Words Assessment - Week 3</p>
        </div>

        <div class="words-grid">
            <div class="word-card">
                <div class="word-text">home</div>
                <div class="assess-box"></div>
            </div>
        </div>
    </div>
</body>
</html>
